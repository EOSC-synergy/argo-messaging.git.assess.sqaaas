config:
  credentials:
  - id: https://github.com/ARGOeu/argo-messaging.git
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/ARGOeu/argo-messaging:
      branch: master
      credential_tmp: true
      credentials_id: https://github.com/ARGOeu/argo-messaging.git
      repo: https://github.com/ARGOeu/argo-messaging.git
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-messaging git:
        commands:
        - /usr/bin/env sh .sqa/script.salmon_vigilant_iguana.sh
        container: qc.acc_thunder_bright_crane
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-messaging find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.flint_bold_ibis.sh
        container: qc.doc_dusk_cheerful_viper
      github.com/ARGOeu/argo-messaging git:
        commands:
        - /usr/bin/env sh .sqa/script.banana_optimistic_orca.sh
        container: qc.doc_turmeric_logical_sparrow
      github.com/ARGOeu/argo-messaging markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.fern_whimsical_newt.sh
        container: qc.doc_horizon_determined_ostrich
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-messaging licensee:
        commands:
        - /usr/bin/env sh .sqa/script.amaranth_attentive_reindeer.sh
        container: qc.lic_butter_vibrant_eel
  QC.Met:
    repos:
      github.com/ARGOeu/argo-messaging cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.flamingo_proud_kookaburra.sh
        container: qc.met_clementine_innocent_mandrill
      github.com/ARGOeu/argo-messaging validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.ice_outgoing_turkey.sh
        container: qc.met_pineapple_amiable_giraffe
  QC.Sec:
    repos:
      github.com/ARGOeu/argo-messaging bandit:
        commands:
        - /usr/bin/env sh .sqa/script.yellow_protective_crane.sh
        container: qc.sec_brown_flexible_ostrich
      github.com/ARGOeu/argo-messaging gosec:
        commands:
        - /usr/bin/env sh .sqa/script.jet_decisive_lionfish.sh
        container: qc.sec_dahlia_ardent_hippopotamus
  QC.Sty:
    repos:
      github.com/ARGOeu/argo-messaging flake8:
        commands:
        - /usr/bin/env sh .sqa/script.puce_happy_porcupine.sh
        container: qc.sty_porcelain_careful_orangutan
      github.com/ARGOeu/argo-messaging jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.seafoam_daring_wildcat.sh
        container: qc.sty_rose_rustic_sphinx
      github.com/ARGOeu/argo-messaging staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.butter_brilliant_piranha.sh
        container: qc.sty_papaya_cranky_uakari
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-messaging pytest:
        commands:
        - /usr/bin/env sh .sqa/script.gunmetal_agile_kiwi.sh
        container: qc.uni_cerulean_proactive_ostrich
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-messaging get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.amethyst_dreamy_hawk.sh
        container: qc.ver_viridian_balanced_roadrunner
timeout: 5400
