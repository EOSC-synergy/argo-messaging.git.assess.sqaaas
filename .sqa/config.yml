config:
  credentials:
  - id: https://github.com/ARGOeu/argo-messaging.git
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/ARGOeu/argo-messaging:
      branch: master
      credential_tmp: true
      credentials_id: https://github.com/ARGOeu/argo-messaging.git
      repo: https://github.com/ARGOeu/argo-messaging.git
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-messaging git:
        commands:
        - /usr/bin/env sh .sqa/script.moss_upbeat_impala.sh
        container: qc.acc_zinnia_hardworking_gull
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-messaging find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.orchid_assured_gazelle.sh
        container: qc.doc_paprika_reckless_cobra
      github.com/ARGOeu/argo-messaging git:
        commands:
        - /usr/bin/env sh .sqa/script.cornflower_courageous_beaver.sh
        container: qc.doc_purple_energetic_seahorse
      github.com/ARGOeu/argo-messaging markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.flax_amused_falcon.sh
        container: qc.doc_isabelline_worried_falcon
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-messaging licensee:
        commands:
        - /usr/bin/env sh .sqa/script.reef_humorous_wolverine.sh
        container: qc.lic_cinnabar_ardent_thrush
  QC.Met:
