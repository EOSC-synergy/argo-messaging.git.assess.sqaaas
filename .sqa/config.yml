config:
  credentials:
  - id: https://github.com/ARGOeu/argo-messaging.git
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/ARGOeu/argo-messaging:
      branch: master
      credential_tmp: true
      credentials_id: https://github.com/ARGOeu/argo-messaging.git
      repo: https://github.com/ARGOeu/argo-messaging.git
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-messaging git:
        commands:
        - /usr/bin/env sh .sqa/script.gunmetal_tenacious_leopard.sh
        container: qc.acc_mist_confident_orca
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-messaging find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.lemon_enigmatic_marmoset.sh
        container: qc.doc_dusk_loyal_manatee
      github.com/ARGOeu/argo-messaging git:
        commands:
        - /usr/bin/env sh .sqa/script.sunset_friendly_kookaburra.sh
        container: qc.doc_sunset_understanding_nymph
      github.com/ARGOeu/argo-messaging markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.apricot_mindful_komodo.sh
        container: qc.doc_sand_tenacious_ocelot
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-messaging licensee:
        commands:
        - /usr/bin/env sh .sqa/script.teal_whimsical_ibis.sh
        container: qc.lic_lavender_carefree_pangolin
  QC.Met:
    repos:
      github.com/ARGOeu/argo-messaging cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.amaranth_witty_ocelot.sh
        container: qc.met_kiwi_logical_orca
      github.com/ARGOeu/argo-messaging validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.blush_methodical_mink.sh
        container: qc.met_denim_delighted_vulture
  QC.Sec:
    repos:
      github.com/ARGOeu/argo-messaging bandit:
        commands:
        - /usr/bin/env sh .sqa/script.marina_lively_meerkat.sh
        container: qc.sec_mango_wise_phoenix
      github.com/ARGOeu/argo-messaging gosec:
        commands:
        - /usr/bin/env sh .sqa/script.ruby_affectionate_kangaroo.sh
        container: qc.sec_flamingo_practical_alligator
  QC.Sty:
    repos:
      github.com/ARGOeu/argo-messaging flake8:
        commands:
        - /usr/bin/env sh .sqa/script.wisteria_attentive_uakari.sh
        container: qc.sty_papaya_supportive_sphinx
      github.com/ARGOeu/argo-messaging jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.papaya_creative_jellyfish.sh
        container: qc.sty_wisteria_realistic_dugong
      github.com/ARGOeu/argo-messaging staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.carmine_lucky_octopus.sh
        container: qc.sty_glacier_lively_kraken
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-messaging pytest:
        commands:
        - /usr/bin/env sh .sqa/script.incarnadine_hardworking_hummingbird.sh
        container: qc.uni_powder_brilliant_narwhal
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-messaging get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.harlequin_helpful_octopus.sh
        container: qc.ver_jasmine_realistic_butterfly
timeout: 5400
