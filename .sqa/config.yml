      github.com/ARGOeu/argo-messaging cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.forest_forgiving_flounder.sh
        container: qc.met_dusk_diplomatic_jackal
      github.com/ARGOeu/argo-messaging validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.storm_tough_gerbil.sh
        container: qc.met_cinnabar_eccentric_octopus
  QC.Sec:
    repos:
      github.com/ARGOeu/argo-messaging bandit:
        commands:
        - /usr/bin/env sh .sqa/script.mustard_wise_rhinoceros.sh
        container: qc.sec_echelon_scrappy_moose
      github.com/ARGOeu/argo-messaging gosec:
        commands:
        - /usr/bin/env sh .sqa/script.brown_insightful_kookaburra.sh
        container: qc.sec_flax_intuitive_grasshopper
  QC.Sty:
