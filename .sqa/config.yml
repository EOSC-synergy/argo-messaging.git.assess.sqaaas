config:
  credentials:
  - id: https://github.com/ARGOeu/argo-messaging.git
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/ARGOeu/argo-messaging:
      branch: master
      credential_tmp: true
      credentials_id: https://github.com/ARGOeu/argo-messaging.git
      repo: https://github.com/ARGOeu/argo-messaging.git
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-messaging git:
        commands:
        - /usr/bin/env sh .sqa/script.maroon_assured_hummingbird.sh
        container: qc.acc_pistachio_ardent_seahorse
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-messaging find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.ginger_thankful_stingray.sh
        container: qc.doc_moss_sad_kangaroo
      github.com/ARGOeu/argo-messaging git:
        commands:
        - /usr/bin/env sh .sqa/script.boysenberry_dramatic_owl.sh
        container: qc.doc_butterscotch_respectful_camel
      github.com/ARGOeu/argo-messaging markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.flamingo_attentive_lobster.sh
        container: qc.doc_jasmine_fierce_spren
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-messaging licensee:
        commands:
        - /usr/bin/env sh .sqa/script.eggplant_adventurous_platypus.sh
        container: qc.lic_pistachio_attentive_turtle
  QC.Met:
    repos:
      github.com/ARGOeu/argo-messaging cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.cornflower_wondrous_spider.sh
        container: qc.met_khaki_peaceful_gull
      github.com/ARGOeu/argo-messaging validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.thunder_timid_pangolin.sh
        container: qc.met_flint_silly_moth
  QC.Sec:
    repos:
      github.com/ARGOeu/argo-messaging bandit:
        commands:
        - /usr/bin/env sh .sqa/script.royal_visionary_elephant.sh
        container: qc.sec_yellow_wise_rabbit
      github.com/ARGOeu/argo-messaging gosec:
        commands:
        - /usr/bin/env sh .sqa/script.claret_hardworking_pegasus.sh
        container: qc.sec_cinnabar_relaxed_termite
  QC.Sty:
    repos:
      github.com/ARGOeu/argo-messaging flake8:
        commands:
        - /usr/bin/env sh .sqa/script.cloud_gentle_hyena.sh
        container: qc.sty_crimson_intuitive_eel
      github.com/ARGOeu/argo-messaging jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.lilac_blissful_kiwi.sh
        container: qc.sty_dusk_romantic_falcon
      github.com/ARGOeu/argo-messaging staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.olive_inspired_peacock.sh
        container: qc.sty_reef_empathetic_rabbit
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-messaging pytest:
        commands:
        - /usr/bin/env sh .sqa/script.echelon_apathetic_ostrich.sh
        container: qc.uni_crimson_dizzy_stingray
  QC.Ver:
